name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # main への push run は途中で打ち切ると最新コミットの結果が欠けるため、PR の古い run だけ取り消す
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Test
        run: npm run test:run
      - name: Build check (wrangler dry-run)
        run: npx wrangler deploy --dry-run
